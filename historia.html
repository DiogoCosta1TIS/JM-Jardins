<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JM Jardins - Sobre Nós</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    
<style>
    /* --- PARTE DE CIMA (HEADER) --- */
    #header {
        background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('img/image jardim.jpg') !important; 
        background-size: cover !important;
        background-position: center !important;
        background-attachment: fixed !important;
        min-height: 50vh; 
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        border: none !important;
        padding: 0 !important;
    }

    /* Limpar lixo do template */
    #header:before, #header:after { display: none !important; background: none !important; }
    
    /* MENU LA DE TOPO */
    #nav {
        position: absolute; top: 20px;
        background: transparent !important;
        width: 100%; z-index: 100;
        text-align: center;
    }

    #nav ul { list-style: none; margin: 0; padding: 0; }
    #nav ul li { display: inline-block; margin: 0 15px; }

    #nav ul li a {
        color: #ffffff !important;
        font-family: 'Montserrat', sans-serif !important; 
        font-weight: 700;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        text-decoration: none;
    }

    #header h1 span { 
        font-size: 2.0em; 
        letter-spacing: 4px; 
        font-weight: 900; 
        color: #fff !important;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .logo-button img { width: auto; height: 180px; }

    /* --- CONTEUDO DA HISTORIA --- */
    .historia-fundo { background-color: #ffffff; padding: 4em 0; text-align: center; }

    /* Foto do Sr Jose redonda */
    .perfil-foto { text-align: center; margin-bottom: 25px; }
    .perfil-foto img {
        width: 200px; height: 200px; 
        object-fit: cover; 
        border-radius: 50%; 
        border: 5px solid #2E5A27; /* Verde da JM */
        box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
    }

    .caixa-texto {
        max-width: 800px; margin: 0 auto; text-align: left; 
        font-family: 'Montserrat', sans-serif; color: #444;
        line-height: 1.8; font-size: 1.1em; padding: 0 25px;
    }

    h2, h3 { text-transform: uppercase !important; color: #2E5A27; }

    /* --- RODAPE --- */
    #footer {
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/image jardim.jpg') !important;
        background-size: cover !important; padding: 4em 0 !important;
        text-align: center !important;
    }

    #footer p {
        color: #ffffff !important; 
        font-family: 'Montserrat', sans-serif !important;
        font-weight: 700 !important; 
        text-transform: uppercase;
    }

    /* --- AJUSTES PA TELEMOVEL --- */
    @media screen and (max-width: 736px) {
        #header { min-height: 60vh !important; }
        .logo-button img { height: 110px !important; }
        #header h1 span { font-size: 1.4em !important; }
        
        /* Menu Mobile Verde */
        #nav { 
            position: relative !important; top: 0 !important; 
            background: #2E5A27 !important; 
            margin-top: 20px !important; 
            padding: 10px 0 !important;
            border-radius: 5px !important;
            display: block !important;
        }
        
        #nav ul li { 
            display: block !important; 
            margin: 0 !important; 
            padding: 10px 0 !important;
            border-bottom: 1px solid rgba(255,255,255,0.1); 
        }

        #nav ul li:last-child { border: none !important; }

        .perfil-foto img { width: 150px; height: 150px; }
        .caixa-texto { text-align: center !important; font-size: 1em; }
    }
</style>
</head>
<body class="homepage is-preload">
    <div id="page-wrapper">

        <header id="header">
            <div class="inner">
                <header>
                    <h1>
                        <a href="index.html" class="logo-button logo-center">
                            <img src="img/logo.png" alt="JM Jardins Logo">
                        </a>
                        <span>JM JARDINS</span>
                    </h1>
                    <p>A NOSSA HISTÓRIA</p>
                </header>
            </div>

            <nav id="nav">
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="galeria.html">Galeria</a></li>
                    <li><a href="historia.html">Sobre Nós</a></li>
                    <li><a href="contactos.html">Contacte-nos</a></li>
                </ul>
            </nav>
        </header>

        <main class="wrapper style1 historia-fundo">
            
            <div class="logo-sobre">
                <img src="img/logo.png" alt="JM Jardins Logo Pequeno">
            </div>

            <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 2.5em; margin-bottom: 30px; color: #222;">Quem Somos</h2>
            
            <div class="caixa-texto">
                
            </div>

            <div class="perfil-foto">
                <img src="img/IMG_SR Jose.jpeg" alt="Imagem jose">
            </div>

            <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 2.5em; margin-bottom: 30px; color: #222;">Quem Sou</h2>

            <div class="caixa-texto">
                
            </div>

        </main>

        <footer id="footer">
            <div class="container">
                <p>&copy; JM Jardins - Construção e Manutenção</p>
                <p style="font-size: 0.8em !important; font-weight: 400 !important;">Atuamos em Vila Nova de Famalicão e Arredores</p>
            </div>
        </footer>

    </div>
</body>
</html>
