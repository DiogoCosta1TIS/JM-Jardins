<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JM Jardins - Galeria</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    
<style>
    /* --- TOPO PADRÃO --- */
    #header {
        background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('img/image jardim.jpg') !important; 
        background-size: cover !important;
        background-position: center !important;
        background-attachment: fixed !important;
        min-height: 50vh; 
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        border: none !important;
        padding: 0 !important;
    }

    #header:before, #header:after { display: none !important; }
    
    #nav {
        position: absolute; top: 20px;
        background: transparent !important;
        width: 100%; z-index: 100;
        text-align: center;
    }

    #nav ul { list-style: none; padding: 0; }
    #nav ul li { display: inline-block; margin: 0 15px; }
    #nav ul li a {
        color: #ffffff !important;
        font-family: 'Montserrat', sans-serif; font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
    }

    #header h1 span { 
        font-size: 2.2em; letter-spacing: 4px; font-weight: 900; 
        color: #fff !important; text-shadow: 2px 2px 4px #000;
    }

    .logo-button img { height: 160px; width: auto; }

    /* --- GALERIA "ARRUMADA" --- */
    .galeria-fundo {
        background-color: #ffffff; 
        padding: 4em 20px;
        /* FLEXBOX MAGICO */
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px; /* Espaço igual entre fotos */
    }

    .galeria-fundo img {
        width: 350px; /* Tamanho fixo po PC */
        height: 250px;
        object-fit: cover; /* Não deixa a imagem esticar/esmagar */
        border: 3px solid #2E5A27; 
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .galeria-fundo img:hover { transform: scale(1.03); }

    /* --- RODAPE --- */
    #footer {
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/image jardim.jpg') !important;
        background-size: cover !important; padding: 4em 0 !important;
        text-align: center !important;
    }

    #footer p { color: #ffffff !important; font-weight: 700; text-transform: uppercase; }

    /* --- AJUSTES TLM (MOBILE) --- */
    @media screen and (max-width: 736px) {
        #header { min-height: 60vh !important; }
        .logo-button img { height: 100px !important; }
        #header h1 span { font-size: 1.5em !important; }
        
        /* FIX DO MENU */
        #nav { 
            position: relative !important; top: 0 !important; 
            background: #2E5A27 !important; 
            margin-top: 20px !important; padding: 10px 0 !important;
            display: block !important;
            border-radius: 5px;
        }
        
        #nav ul li { 
            display: block !important; 
            padding: 10px 0 !important;
            border-bottom: 1px solid rgba(255,255,255,0.1); 
        }

        /* GALERIA NO TLM */
        .galeria-fundo { padding: 2em 10px !important; }
        .galeria-fundo img { 
            width: 100% !important; /* Foto ocupa a largura toda */
            height: auto !important; 
            margin: 0 !important; 
        }
    }
</style>
</head>
<body class="homepage is-preload">
    <div id="page-wrapper">

        <header id="header">
            <div class="inner">
                <header>
                    <h1>
                        <a href="index.html" class="logo-button logo-center">
                            <img src="img/logo.png" alt="JM Jardins Logo">
                        </a>
                        <span>JM JARDINS</span>
                    </h1>
                    <p>A NOSSA GALERIA DE TRABALHOS</p>
                </header>
            </div>

            <nav id="nav">
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="galeria.html">Galeria</a></li>
                    <li><a href="historia.html">Sobre Nós</a></li>
                    <li><a href="contactos.html">Contacte-nos</a></li>
                </ul>
            </nav>
        </header>

        <main class="wrapper style1 galeria-fundo">
            <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 700; margin-bottom: 30px;">Fotos dos Trabalhos</h2>
            
            <div style="text-align: center;">
                <img src="img/img 1.jpeg">
                <img src="img/img 2.jpeg">
                <img src="img/img 3.jpeg">
                <img src="img/img 4.jpeg">
                <img src="img/img 5.jpeg">
                <img src="img/img 6.jpeg">
                <img src="img/img 7.jpeg">
                <img src="img/img 8.jpeg">
                <img src="img/img 9.jpeg">
                <img src="img/img 10.jpeg">
                <img src="img/img 11.jpeg">
                <img src="img/img 12.jpeg">
                <img src="img/img 13.jpeg">
                <img src="img/img 14.jpeg">
                <img src="img/img 15.jpeg">
            </div>
        </main>

        <footer id="footer">
            <div class="container">
                <p>&copy; JM Jardins - Vila Nova de Famalicão</p>
            </div>
        </footer>

    </div>
</body>
</html>
